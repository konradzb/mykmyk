# description: Internal L2. ARP-gated discovery, trunk/VLAN aware. Fast, requires root.
#
# Internal L2 profile: ARP-gated discovery, trunk/VLAN aware.
#
# Requires root (both -PR and -sS do). ARP cannot cross a router, so every segment listed in
# ./hosts must be on a directly attached broadcast domain. For routed segments, swap the
# arp-discovery args for a ping sweep: ["-sn","-PE","-PS443","-PA80","-PU40125","-vvv","-oA"]
#
# hosts file format - the second column is optional and names the interface reaching that segment:
#   10.113.9.0/24    eth0.100
#   10.113.10.0/24   eth0.200
#   192.168.50.0/24  eth0.300
outputFile: ./mykmyk-output.html
workflow:
  tasks:
    - name: scope
      type: filesystem
      active: true
      useCache: true
      run:
        input: ./hosts

    # ARP sweep per segment -> emits one message per LIVE host, carrying its interface.
    # This is the whole point of the profile: dead addresses are never port-scanned.
    - name: arp-discovery
      type: nmap
      source: scope
      active: true
      useCache: true
      concurrency: 8            # segments (VLANs) swept in parallel
      run:
        args:
          - "-sn"
          - "-PR"
          - "-vvv"
          - "-oA"

    # Full TCP port scan, live hosts only.
    # --send-ip is required, not cosmetic: -Pn alone does NOT stop nmap ARPing on a local segment
    # (it still needs each target's MAC to build a frame) and would drop hosts the sweep just
    # proved up. --send-ip sends at raw IP level so the kernel answers from the ARP cache.
    - name: ST-scan
      type: nmap
      source: arp-discovery
      active: true
      useCache: true
      concurrency: 16
      run:
        args:
          - "-sS"
          - "-vvv"
          - "-Pn"
          - "--send-ip"
          - "--open"
          - "--min-rate"
          - "2000"
          - "-p-"
          - "-oA"

    # -sV against ONLY the ports ST-scan found open. The port list arrives on the message, so
    # there must be no -p flag here or nmap would be given two and rescan all 65535.
    - name: SV-scan
      type: nmap
      source: ST-scan
      active: true
      useCache: true
      concurrency: 8
      run:
        args:
          - "-sV"
          - "-sC"
          - "-vvv"
          - "-Pn"
          - "--send-ip"
          - "-A"
          - "--version-all"
          - "--open"
          - "-oA"

    - name: RMI-scan
      type: nmap
      source: ST-scan
      active: true
      useCache: true
      concurrency: 8
      run:
        args:
          - "-sT"
          - "-vvv"
          - "-Pn"
          - "--script=+rmi-dumpregistry"
          - "--open"
          - "--max-rate"
          - "1000"
          - "-oA"

    - name: httpx-scan
      type: httpx
      source: ST-scan
      active: true
      useCache: true
      concurrency: 5
      run:
        args:
          - "-td"
          - "-vhost"

    # nuclei and ffuf are the slow consumers - minutes per target. The oversized queues keep them
    # from back-pressuring port discovery through the SNS fan-out.
    - name: nuclei-scan
      type: nuclei
      source: httpx-scan
      active: true
      useCache: true
      concurrency: 3
      queueSize: 1024
      run:
        args:
          - "-etags"
          - "wordpress,dos,fuzz"
          - "-ud"
          - "/opt/mykmyk-bundle/nuclei-templates"
          - "-rl"
          - "3"
          - "-c"
          - "5"
          - "-ni"
          - "-duc"
          - "-nc"

    - name: ffuf-scan
      type: ffuf
      source: httpx-scan
      active: true
      useCache: true
      concurrency: 3
      queueSize: 1024
      run:
        args:
          - "-w"
          - "/opt/mykmyk-bundle/wordlist/raft-large-directories.txt"
          - "-ac"
          - "-rate"
          - "300"
          - "-v"

    - name: ssl-scan
      type: sslscan
      source: httpx-scan
      active: true
      useCache: true
      concurrency: 5
      run:
        args:
          - "--no-colour"
          - "--iana-names"

    - name: ssl-scan-psql
      type: sslscan
      source: ST-scan
      port: 5432
      active: true
      useCache: true
      concurrency: 5
      run:
        args:
          - "--no-colour"
          - "--iana-names"
          - "--starttls-psql"

    - name: nc-fingerprint
      type: nc
      source: ST-scan
      active: true
      useCache: true
      concurrency: 8
      run:
        args:
          - "<>()&;id"
          - "aa()"

    - name: smb-check
      type: smb
      source: ST-scan
      active: true
      useCache: true
      concurrency: 5

    - name: rdp-check
      type: rdp
      source: ST-scan
      port: 3389
      active: true
      useCache: true
      concurrency: 5
